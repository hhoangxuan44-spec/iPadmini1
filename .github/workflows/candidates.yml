name: 列出候选图片

on:
  workflow_dispatch:
    inputs:
      group:
        description: 候选组（nature wild city china east west）
        default: nature

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow zhconv
      - name: 列出候选
        run: python build/list_candidates.py ${{ inputs.group }}
