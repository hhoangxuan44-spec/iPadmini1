name: 构建并发布月历

on:
  push:
    branches: [main, ccr-bd321eaa-8zd5p8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow zhconv
      # 缓存已下载的原图，后续构建不用重复下载
      - uses: actions/cache@v4
        with:
          path: build/.cache
          key: commons-${{ hashFiles('build/build_site.py', 'build/catalog.py') }}
          restore-keys: commons-
      - name: 下载图片并生成网站
        run: python build/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 选图报告
        if: always()
        run: cat build/report.txt || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
