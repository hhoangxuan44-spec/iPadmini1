name: 构建并发布月历

on:
  push:
    branches: [main, ccr-bd321eaa-8zd5p8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 安卓 App（动态壁纸 / 屏保 / 全屏摆件），打包好的 APK 放在网站上供下载
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: 打包安卓 App
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk

  # 冒烟测试（不影响发布）：用 Robolectric 在没有手机的情况下展开所有组件布局、打开主界面，提前发现闪退
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: 运行冒烟测试
        run: gradle -p android testDebugUnitTest --no-daemon --stacktrace -i
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: android/app/build/reports/tests

  build:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow zhconv
      # 缓存已下载的原图，后续构建不用重复下载
      - uses: actions/cache@v4
        with:
          path: build/.cache
          key: commons-${{ hashFiles('build/build_site.py', 'build/catalog.py') }}
          restore-keys: commons-
      - name: 下载图片并生成网站
        run: python build/build_site.py
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - run: cp apk/app-release.apk dist/guangying.apk
      - name: 写入版本号（App 用它检查有没有新版本）
        run: echo '{"versionCode":${{ github.run_number }},"apk":"guangying.apk"}' > dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 选图报告
        if: always()
        run: cat build/report.txt || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
